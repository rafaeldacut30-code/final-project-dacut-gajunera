<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PomoGochi - Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar">
    <div class="brand">
      <span class="logo-box" aria-hidden="true">🐲</span>
      <span class="brand-name">PomoGochi</span>
    </div>
    <nav class="nav-links" aria-label="Quiz Navigation">
      <a href="index.html" class="nav-btn">← Back to Dashboard</a>
    </nav>
  </header>

  <main class="main-frame">
    <section id="quiz-box" class="quiz-box">
      <p id="question-counter" class="stage-label">Question 1 of 3</p>
      <h2 id="question-text">Loading question...</h2>
      <div id="choices-container" class="choices-list"></div>
      <p id="quiz-feedback" class="stage-label" aria-live="polite"></p>
      <button id="next-btn" type="button" class="primary-btn hidden">Next Question →</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
